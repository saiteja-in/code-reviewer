services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: codereviewer
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codereviewer"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  indexer-worker:
    build:
      context: .
      dockerfile: workers/indexer/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/codereviewer
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      INDEXER_WORKSPACE_DIR: /tmp/repos
      INNGEST_DEV: "1"
      INNGEST_BASE_URL: http://host.docker.internal:8288
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - index_workspace:/tmp/repos
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  neo4j_data:
  index_workspace:
